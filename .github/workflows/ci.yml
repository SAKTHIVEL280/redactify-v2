name: Redactify V2 CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    name: Test & Production Build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies (pdftotext)
        run: sudo apt-get update -y && sudo apt-get install -y poppler-utils

      - name: Install Dependencies
        run: npm ci

      - name: Run Forensic Unit Tests & Algorithm Benchmarks
        run: npm test

      - name: Verify Production Vite Bundle
        run: npm run build

      - name: Verify Zero Network Assets Leak
        run: |
          test -f dist/_headers || (echo "Missing Cloudflare _headers in dist" && exit 1)
          test -f dist/tessdata/eng.traineddata || (echo "Missing offline tessdata in dist" && exit 1)
          echo "Production artifacts verified successfully."
